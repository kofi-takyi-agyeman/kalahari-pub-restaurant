<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="100%" height="100%">
  <defs>
    <linearGradient id="cGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE853" />
      <stop offset="50%" stop-color="#F9D817" />
      <stop offset="100%" stop-color="#C99E05" />
    </linearGradient>
    <linearGradient id="cFlameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#9E1212" />
      <stop offset="35%" stop-color="#D92323" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#F9D817" />
    </linearGradient>
  </defs>

  <!-- Left Emblem Mark -->
  <g transform="translate(4, 4)">
    <circle cx="28" cy="28" r="27" fill="#171714" stroke="url(#cGoldGrad)" stroke-width="2.5" />
    <circle cx="28" cy="28" r="24" fill="#23231F" />
    <!-- Flame -->
    <path d="M 28 9 C 32 15, 36 17, 38 23 C 41 30, 39 37, 33 40 C 31 37, 32 33, 31 30 C 30 27, 27 25, 27 21 C 25 25, 23 28, 22 31 C 22 35, 23 37, 22 40 C 17 37, 15 30, 18 23 C 21 17, 25 15, 28 9 Z" fill="url(#cFlameGrad)" />
    <!-- Core -->
    <path d="M 28 17 C 30 22, 33 24, 34 29 C 36 34, 34 38, 30 40 C 29 37, 30 34, 29 32 C 28 29, 26 27, 26 25 C 25 28, 24 30, 23 33 C 23 35, 24 37, 23 39 C 20 36, 20 31, 22 27 C 24 22, 26 21, 28 17 Z" fill="#FFE853" />
    <!-- Crossed Skewers -->
    <line x1="11" y1="44" x2="44" y2="21" stroke="url(#cGoldGrad)" stroke-width="1.8" stroke-linecap="round" />
    <line x1="12" y1="43" x2="20" y2="37" stroke="#D92323" stroke-width="3" stroke-linecap="round" />
    <line x1="45" y1="44" x2="12" y2="21" stroke="url(#cGoldGrad)" stroke-width="1.8" stroke-linecap="round" />
    <line x1="44" y1="43" x2="36" y2="37" stroke="#D92323" stroke-width="3" stroke-linecap="round" />
    <circle cx="28" cy="33" r="2" fill="#FFE853" />
  </g>

  <!-- Typography: KALAHARI -->
  <text x="68" y="32" font-family="'Outfit', 'Inter', system-ui, -apple-system, sans-serif" font-weight="900" font-size="26" fill="#171714" letter-spacing="1">
    KALAHARI
  </text>

  <!-- Sub-Badge: PUB & RESTAURANT -->
  <rect x="68" y="38" width="136" height="18" rx="4" fill="#D92323" />
  <text x="74" y="51" font-family="'Outfit', 'Inter', system-ui, -apple-system, sans-serif" font-weight="800" font-size="9.5" fill="#FFFFFF" letter-spacing="1.5">
    PUB &amp; RESTAURANT
  </text>

  <!-- Accra Ghana Subtitle Tag -->
  <text x="212" y="51" font-family="'Outfit', 'Inter', system-ui, -apple-system, sans-serif" font-weight="700" font-size="9" fill="#6B7280" letter-spacing="1">
    ACCRA • GH
  </text>
</svg>
